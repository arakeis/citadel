name: Build
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build_app:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          workspaces: "."

      - name: (Ubuntu only) Install dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install node packages
        run: bun install

      - name: List installed versions
        run: |
          bun --version;
          cargo --version;
          bun tauri --version

      # Plain `tauri build` rather than tauri-action: this workflow publishes
      # nothing, and the DMG step (hdiutil on the macOS runners) fails
      # intermittently, so retry it. Later attempts reuse the compiled target.
      - name: Build the app
        run: |
          for attempt in 1 2 3; do
            if bun tauri build --verbose; then
              exit 0
            fi
            echo "::warning::tauri build failed on attempt $attempt"
          done
          exit 1

      - name: (Ubuntu only) Upload build artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-and-appimage
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

      - name: (macOS only) Upload build artifacts
        if: matrix.platform == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-and-dmg
          path: |
            target/release/bundle/macos/Citadel.app
            target/release/bundle/dmg/*.dmg
